<template>
    <lightning-card title="Contact Orbit suggestions" icon-name="standard:case">
        <template if:true={isLoading}><lightning-spinner alternative-text="Updating suggestion" size="small"></lightning-spinner></template>
        <div class="match-intro slds-p-horizontal_medium slds-p-top_small">
            <p class="slds-text-body_regular">Review verified identity matches before updating the Case Contact.</p>
            <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">Suggestions never grant access or authorize a customer action.</p>
        </div>
        <template if:true={hasMatches}>
            <div class="match-list slds-p-horizontal_medium slds-p-bottom_medium">
                <template for:each={matches} for:item="match">
                    <article key={match.Id} class="match-row slds-box slds-m-top_small" aria-label="Contact Orbit suggestion">
                        <div class="match-row__header"><lightning-badge label={match.Status__c}></lightning-badge><span class="slds-text-title_caps slds-text-color_weak">{match.Reason_Code__c}</span></div>
                        <p class="slds-text-heading_small slds-m-top_small">{match.Candidate_Contact__r.Name}</p>
                        <div class="match-row__actions slds-m-top_small">
                            <template if:true={match.Candidate_Contact__c}><lightning-button variant="brand" label="Confirm" data-id={match.Id} onclick={askConfirm}></lightning-button></template>
                            <lightning-button class="button-gap" label="Reject" data-id={match.Id} onclick={askReject}></lightning-button>
                        </div>
                    </article>
                </template>
            </div>
        </template>
        <template if:false={hasMatches}><div class="match-empty slds-p-around_large"><lightning-icon icon-name="utility:check" size="small" alternative-text=""></lightning-icon><p class="slds-m-top_small">No actionable suggestions are pending.</p><p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">New matches will appear here when suggestion mode is enabled.</p></div></template>
    </lightning-card>
    <template if:true={hasPending}>
        <section role="dialog" aria-modal="true" aria-labelledby="match-confirm-heading" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header"><h2 id="match-confirm-heading" class="slds-text-heading_medium">Confirm suggestion action</h2></header>
                <div class="slds-modal__content slds-p-around_medium">Confirming rechecks verification and Case access. Rejecting keeps the Case unchanged.</div>
                <footer class="slds-modal__footer"><lightning-button label="Cancel" onclick={cancel}></lightning-button><lightning-button class="button-gap" variant="brand" label="Continue" onclick={complete}></lightning-button></footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
